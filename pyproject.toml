[project]
name = "touchline-takes"
version = "0.1.0"
description = "AI-powered football takes, straight from the touchline."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["touchline_takes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pylint.main]
ignore = [".venv"]
jobs = 0

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["too-few-public-methods", "too-many-instance-attributes", "too-many-arguments",
           "too-many-positional-arguments", "duplicate-code"]

[tool.pylint.design]
# The newsroom agents assemble evidence in a few long-but-linear methods and the
# repository class is intentionally one flat API, so the defaults are relaxed slightly.
max-locals = 22
max-branches = 14
max-public-methods = 30
