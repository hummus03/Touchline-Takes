# Builds the static site from content/articles and deploys it to GitHub Pages.
# Runs when articles are merged into main, after each newsroom run, or by hand.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "site_root/**"
      - "touchline_takes/**"
      - "requirements-actions.txt"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TOUCHLINE_ENV: production
  SITE_MODE: static
  SITE_URL: ${{ vars.SITE_URL || 'https://touchlinetakes.com' }}
  STATE_DIR: .newsroom

jobs:
  build:
    if: vars.TOUCHLINE_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - name: Install
        run: pip install -r requirements-actions.txt

      - name: Fetch fixtures from the newsroom state
        run: scripts/newsroom_state.sh restore

      - name: Validate articles (no claim without a source)
        run: python -m touchline_takes.static validate

      - name: Build
        run: python -m touchline_takes.static build --out _site --state-db .newsroom/touchline_takes.db

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Posts each newly published article to social networks once the site is live.
  # Bluesky (free) runs when its two secrets exist. X costs credits per post, so it also
  # needs the repository variable X_AUTO_POST=true. Which articles were posted is kept
  # on the social-state branch; a failed post is retried on the next deploy and never
  # fails this one.
  post-social:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the social-state branch
    env:
      STATE_BRANCH: social-state
      STATE_DIR: .social
      BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - name: Install
        run: pip install -r requirements-actions.txt

      - name: Restore what has been posted
        run: scripts/newsroom_state.sh restore

      - name: Post new articles to Bluesky
        continue-on-error: true
        run: python scripts/post_social.py --network bluesky --state .social/bluesky_posted.json

      - name: Post new articles to X
        if: vars.X_AUTO_POST == 'true'
        continue-on-error: true
        run: python scripts/post_social.py --network x --state .social/x_posted.json

      - name: Save what has been posted
        run: scripts/newsroom_state.sh save
