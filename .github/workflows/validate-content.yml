# Checks article files changed in a pull request (e.g. a human edit to a review PR).
name: Validate articles

on:
  pull_request:
    paths:
      - "content/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - run: pip install -r requirements-actions.txt
      - name: Validate articles (no claim without a source)
        run: python -m touchline_takes.static validate
