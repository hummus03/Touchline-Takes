# Tests and lint for code changes.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "content/**"
  pull_request:
    paths-ignore:
      - "content/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:warnings
      - run: pylint touchline_takes tests scripts

  mobile:
    # The Expo app in mobile/: install exactly what the lockfile says, then typecheck.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
